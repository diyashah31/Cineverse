name: Deploy to Vercel

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: team_i1RNPoST0mtqhoYvc3fgiUJE
          vercel-project-id: prj_k3z91pi3v1XzQYHJH5Cg2u7dGPxf
          vercel-args: --prod

      # Note: Add the secret `VERCEL_TOKEN` to this repository's Settings → Secrets
