        .doodle-border {
            border: 2.5px solid #ffffff;
            border-radius: 3px;
            filter: url(#doodle-wobble);
            position: relative;
        }

        .doodle-border::before,
        .doodle-border::after {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            border: 2px solid #ffffff;
            pointer-events: none;
        }

        .doodle-border::before {
            top: -6px;
            left: -6px;
            border-right: none;
            border-bottom: none;
            transform: rotate(-4deg);
        }

        .doodle-border::after {
            bottom: -6px;
            right: -6px;
            border-left: none;
            border-top: none;
            transform: rotate(-4deg);
        }

        .doodle-card {
            border: 2.5px solid #ffffff;
            border-radius: 2px 14px 2px 14px / 14px 2px 14px 2px;
            filter: url(#doodle-wobble);
        }

        .chip,
        .platform-card {
            transition: all 0.25s ease;
        }

        .active {
            background: #ffffff !important;
            color: #000000 !important;
            transform: scale(1.05) rotate(1deg);
        }

        .card:hover {
            transform: rotate(1.5deg) scale(1.03);
        }

        }

            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            background: transparent;
            pointer-events: none;
            -webkit-appearance: none;
            appearance: none;
        }
        .dual-range::-webkit-slider-thumb {
            pointer-events: auto;
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #ffffff;

        }
        .dual-range::-moz-range-thumb {

            const container = document.getElementById('genre-chips');
            container.innerHTML = allGenres.map(g => `
                <div onclick="toggleGenre(${g.id}, this)" class="chip doodle-border p-6 text-center cursor-pointer hover:rotate-2">
                    <div class="handwritten text-xl">${g.name}</div>
                </div>
            `).join('');
        }

        function renderPlatforms() {
            const container = document.getElementById('platform-grid');
            container.innerHTML = allPlatforms.map(p => `
                <div onclick="togglePlatform(${p.id}, this)" class="platform-card chip doodle-border p-5 text-center cursor-pointer hover:rotate-2 flex flex-col items-center gap-2">
                    <img src="static/platforms/${p.logo}" class="platform-logo" alt="${p.name}" onerror="this.style.display='none'">
                    <div class="handwritten text-base">${p.name}</div>
                </div>
            `).join('');
        }

        function toggleGenre(id, el) {
            el.classList.toggle('active');
            if (selections.genres.includes(id)) selections.genres = selections.genres.filter(g => g !== id);
            else selections.genres.push(id);
        }

        function togglePlatform(id, el) {
            el.classList.toggle('active');
            if (selections.platforms.includes(id)) selections.platforms = selections.platforms.filter(p => p !== id);
            else selections.platforms.push(id);
        }

        // Dual-handle year range slider
        const yearStartInput = document.getElementById('year-start');
        const yearEndInput = document.getElementById('year-end');
        const rangeFill = document.getElementById('range-fill');
        const MIN_YEAR = 1950, MAX_YEAR = 2026;

        function updateRangeUI() {
            let start = parseInt(yearStartInput.value);
            let end = parseInt(yearEndInput.value);

            if (start > end - 1) { // keep a 1-year minimum gap, don't let handles cross
                start = end - 1;
                yearStartInput.value = start;
            }

            selections.yearStart = start;
            selections.yearEnd = end;

            document.getElementById('year-start-label').textContent = start;
            document.getElementById('year-end-label').textContent = end;

            const pctStart = ((start - MIN_YEAR) / (MAX_YEAR - MIN_YEAR)) * 100;
            const pctEnd = ((end - MIN_YEAR) / (MAX_YEAR - MIN_YEAR)) * 100;
            rangeFill.style.left = pctStart + '%';
            rangeFill.style.width = (pctEnd - pctStart) + '%';

            // bring whichever handle is closer to the front so it stays draggable
            yearStartInput.style.zIndex = start > end - 5 ? 5 : 3;
            yearEndInput.style.zIndex = 4;
        }

        yearStartInput.addEventListener('input', updateRangeUI);
        yearEndInput.addEventListener('input', updateRangeUI);
        updateRangeUI();

        async function fetchRecommendations(page = 1) {
            currentPage = page;
            const container = document.getElementById('results-grid');
            container.innerHTML = `<div class="col-span-full text-center py-20 handwritten text-3xl">sketching your recs...</div>`;

            try {
                // If the user picked a single platform in the results-page dropdown, use just that one
                const sourceIds = platformFilterOverride
                    ? [parseInt(platformFilterOverride)]
                    : (selections.platforms.length ? selections.platforms : [203]);

                const params = new URLSearchParams({
                    source_ids: sourceIds.join(','),
                    types: 'movie,tv_series',
                    limit: PAGE_SIZE,
                    sort_by: selections.sortBy || 'release_date_desc',
                    page: page
                });

                if (selections.genres.length) params.append('genres', selections.genres.join(','));

                params.append('releaseDateStart', `${selections.yearStart}0101`);
                params.append('releaseDateEnd', `${selections.yearEnd}1231`);

                const url = `${API_BASE}/list-titles/?${params.toString()}`;
                console.log("Fetching:", url);

                const res = await fetch(url, { headers: { 'X-API-Key': API_KEY } });
                if (!res.ok) throw new Error((await res.json()).statusMessage || 'API Error');

                const data = await res.json();

                console.log(data);

                let titles = data.titles || [];

                // Watchmode's sort_by is unreliable for release-date ordering,
                // so we sort the returned page ourselves to guarantee correct order
                if (selections.sortBy === 'release_date_desc') {
                    titles = [...titles].sort((a, b) => (b.year || 0) - (a.year || 0));
                } else if (selections.sortBy === 'release_date_asc') {
                    titles = [...titles].sort((a, b) => (a.year || 0) - (b.year || 0));
                }

                renderResults(
                    titles,
                    data.total_pages || 1
                );
            } catch (e) {
                console.error(e);
                renderResults([], 1); // fallback will show mock
            }
        }

        function renderResults(movies, totalPages) {
            const container = document.getElementById('results-grid');

            if (!movies || movies.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-20 handwritten text-2xl">No matches found.<br>Try different filters ✏️</div>`;
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            const platformNames = platformFilterOverride
                ? (allPlatforms.find(p => p.id === parseInt(platformFilterOverride))?.name || 'Streaming')
                : allPlatforms
                    .filter(p => selections.platforms.includes(p.id))
                    .map(p => p.name)
                    .join(', ');

            container.innerHTML = movies.map((movie, idx) => {
                const rotateClass = idx % 3 === 0 ? '-rotate-1' : idx % 3 === 1 ? 'rotate-1' : '-rotate-[0.5deg]';

                return `
            <div
                class="card doodle-card ${rotateClass} p-6 cursor-pointer hover:bg-white hover:text-black transition-all bg-black">

                <div class="flex justify-between items-start gap-3 mb-4">
                    <h3 class="handwritten text-2xl leading-tight">
                        ${movie.title}
                    </h3>
                    <span class="text-3xl shrink-0">🎞️</span>
                </div>

                <div class="flex flex-wrap gap-2 text-sm">
                    <span class="border border-current px-3 py-1 rounded-full handwritten">
                        📅 ${movie.year || 'N/A'}
                    </span>
                    <span class="border border-current px-3 py-1 rounded-full handwritten">
                        📺 ${platformNames || 'Streaming'}
                    </span>
                </div>
            </div>
            `;
            }).join('');

            // Pagination
            renderPagination(totalPages);
        }

        function renderPagination(totalPages) {
            const pagContainer = document.getElementById('pagination');
            let html = '';
            for (let i = 1; i <= Math.min(totalPages, 5); i++) {
                html += `<button onclick="fetchRecommendations(${i})" class="px-4 py-2 sm:px-5 sm:py-3 border border-white text-sm sm:text-base ${i === currentPage ? 'bg-white text-black' : 'hover:bg-white hover:text-black'}">${i}</button>`;
            }
            pagContainer.innerHTML = html;
        }

        function closeModal() {
            document.getElementById('detail-modal').classList.add('hidden');
        }

        function showStep(step) {
            document.querySelectorAll('.step-content')
                .forEach(s => s.classList.add('hidden'));

            document.getElementById(`step-${step}`)
                .classList.remove('hidden');

            currentStep = step;

            document.querySelectorAll('.step').forEach((el, index) => {
                el.classList.toggle('active', index + 1 === step);
            });

            // We're back in the wizard, so Back/Next should be visible again
            document.getElementById('bottom-nav').classList.remove('hidden');
        }

        function nextStep() {
            if (currentStep < 3) {
                showStep(currentStep + 1);
                return;
            }

            document.querySelectorAll('.step-content')
                .forEach(el => el.classList.add('hidden'));

            document
                .getElementById('results-screen')
                .classList.remove('hidden');

            // No Back/Next once results are showing — Remix/New Vibe replace that role
            document.getElementById('bottom-nav').classList.add('hidden');

            populatePlatformFilter();
            fetchRecommendations(1);
        }
        function prevStep() {
            if (currentStep > 1) showStep(currentStep - 1);
        }

        function goToStep(step) {
            if (step <= currentStep) showStep(step);
        }

        function resetApp() {
            selections = { genres: [], platforms: [], yearStart: 2000, yearEnd: 2026, sortBy: 'release_date_desc' };
            platformFilterOverride = null;
            document.querySelectorAll('.chip, .platform-card').forEach(el => el.classList.remove('active'));
            document.getElementById('year-start').value = 2000;
            document.getElementById('year-end').value = 2026;
            updateRangeUI();
            document.getElementById('results-screen').classList.add('hidden');
            renderPlatforms();
            showStep(1);
        }

        function populatePlatformFilter() {
            const select = document.getElementById('platform-filter-select');
            const selected = allPlatforms.filter(p => selections.platforms.includes(p.id));

            select.innerHTML = '<option value="">All Selected</option>' +
                selected.map(p => `<option value="${p.id}">${p.name}</option>`).join('');

            platformFilterOverride = null;
            select.value = '';
        }

        function onPlatformFilterChange() {
            const select = document.getElementById('platform-filter-select');
            platformFilterOverride = select.value || null;
            fetchRecommendations(1);
        }

        function onSortChange() {
            const select = document.getElementById('sort-select');
            selections.sortBy = select.value;
            fetchRecommendations(1);
        }

        // Init
        window.onload = () => {
            renderGenres();
            renderPlatforms();
            showStep(1);
        };
    </script>
</body>

</html>
